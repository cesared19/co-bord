services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cobord
      POSTGRES_USER: cobord
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cobord -d cobord']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://cobord:${DB_PASSWORD}@db:5432/cobord
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - app-data:/data
    ports:
      - '${APP_PORT:-3200}:8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  app-data:
